services:
  db:
    image: postgres:16-alpine
    container_name: wcfit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wcfit}
      POSTGRES_USER: ${POSTGRES_USER:-wcfit_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wcfit_senha_forte_2026}
      TZ: America/Fortaleza
    ports:
      - "5432:5432"
    volumes:
      - pgdata_wcfit:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wcfit_admin} -d ${POSTGRES_DB:-wcfit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/src
      dockerfile: ../Dockerfile
    container_name: wcfit-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      TZ: America/Fortaleza
      DATABASE_URL: postgresql://${POSTGRES_USER:-wcfit_admin}:${POSTGRES_PASSWORD:-wcfit_senha_forte_2026}@db:5432/${POSTGRES_DB:-wcfit}
      CHECKIN_FACIAL_CHAVE: ${CHECKIN_FACIAL_CHAVE:-}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET de produção}
      SUPER_ADMIN_TOTP_KEY: ${SUPER_ADMIN_TOTP_KEY:-}
      IDEMPOTENCIA_HMAC_VERSAO: ${IDEMPOTENCIA_HMAC_VERSAO:-}
      IDEMPOTENCIA_HMAC_CHAVES: ${IDEMPOTENCIA_HMAC_CHAVES:-}
      SUPER_ADMIN_CONVITE_ORIGIN: ${SUPER_ADMIN_CONVITE_ORIGIN:-}
      SUPER_ADMIN_ORIGEM_LOCAL: ${SUPER_ADMIN_ORIGEM_LOCAL:-}
      GESTAO_EMAIL_API_KEY: ${GESTAO_EMAIL_API_KEY:-}
      GESTAO_EMAIL_REMETENTE: ${GESTAO_EMAIL_REMETENTE:-}
      CADASTRO_PUBLICO_ATIVO: ${CADASTRO_PUBLICO_ATIVO:-false}
      CADASTRO_EMAIL_API_KEY: ${CADASTRO_EMAIL_API_KEY:-}
      CADASTRO_EMAIL_REMETENTE: ${CADASTRO_EMAIL_REMETENTE:-}
      CADASTRO_TOKEN_CHAVE: ${CADASTRO_TOKEN_CHAVE:-}
      CADASTRO_TERMOS_URL: ${CADASTRO_TERMOS_URL:-}
      CADASTRO_PRIVACIDADE_URL: ${CADASTRO_PRIVACIDADE_URL:-}
      ASAAS_SANDBOX_ATIVO: ${ASAAS_SANDBOX_ATIVO:-false}
      ASAAS_SANDBOX_API_KEY: ${ASAAS_SANDBOX_API_KEY:-}
      ASAAS_SANDBOX_RETORNO: ${ASAAS_SANDBOX_RETORNO:-}
      ASAAS_SANDBOX_NAMESPACE: ${ASAAS_SANDBOX_NAMESPACE:-}
      ASAAS_SANDBOX_WEBHOOK_TOKEN: ${ASAAS_SANDBOX_WEBHOOK_TOKEN:-}
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: wcfit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata_wcfit:
