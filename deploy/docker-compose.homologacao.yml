name: wcfit-homologacao
services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wcfit_homolog
      POSTGRES_DB: wcfit_homolog
      POSTGRES_PASSWORD: ${HOMOLOG_POSTGRES_PASSWORD:?Gere uma senha exclusiva da homologação}
    volumes:
      - pgdata_homologacao:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, wcfit_homolog, -d, wcfit_homolog]
      interval: 2s
      timeout: 4s
      retries: 15
  backend:
    restart: unless-stopped
    build:
      context: ../backend/src
      dockerfile: ../Dockerfile
    image: wcfit-homologacao-backend:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://wcfit_homolog:${HOMOLOG_POSTGRES_PASSWORD}@db:5432/wcfit_homolog
      JWT_SECRET: ${HOMOLOG_JWT_SECRET:?Gere um JWT exclusivo da homologação}
      APP_CORS_ORIGIN: ${HOMOLOG_ORIGEM:-https://homologacao.example.invalid}
      SUPER_ADMIN_SEM_TOTP_LOCAL: ${HOMOLOG_SUPER_ADMIN_SEM_TOTP_LOCAL:-false}
      SUPER_ADMIN_TOTP_KEY: ${HOMOLOG_TOTP_KEY:?Configure a chave TOTP}
      SUPER_ADMIN_ORIGEM_LOCAL: ${HOMOLOG_SUPER_ADMIN_ORIGEM_LOCAL:-}
      SUPER_ADMIN_PROXY_LOCAL_TOKEN: ${HOMOLOG_SUPER_ADMIN_PROXY_LOCAL_TOKEN:-}
      SUPER_ADMIN_CONVITE_ORIGIN: "https://localhost:8081"
      CADASTRO_PUBLICO_ATIVO: ${CADASTRO_PUBLICO_ATIVO:-false}
      CADASTRO_EMAIL_API_KEY: ${CADASTRO_EMAIL_API_KEY:-}
      CADASTRO_EMAIL_REMETENTE: onboarding@resend.dev
      CADASTRO_EMAIL_DESTINO_TESTE: ${CADASTRO_EMAIL_DESTINO_TESTE:-}
      CADASTRO_TOKEN_CHAVE: ${CADASTRO_TOKEN_CHAVE:-}
      IDEMPOTENCIA_HMAC_VERSAO: v1
      IDEMPOTENCIA_HMAC_CHAVES: ${HOMOLOG_IDEMPOTENCIA_HMAC_CHAVES:-}
      ASAAS_SANDBOX_ATIVO: ${ASAAS_SANDBOX_ATIVO:-false}
      ASAAS_SANDBOX_API_KEY: ${ASAAS_SANDBOX_API_KEY:-}
      ASAAS_SANDBOX_NAMESPACE: ${ASAAS_SANDBOX_NAMESPACE:-}
      ASAAS_SANDBOX_WEBHOOK_TOKEN: ${ASAAS_SANDBOX_WEBHOOK_TOKEN:-}
      ASAAS_SANDBOX_RETORNO: ${HOMOLOG_ORIGEM:-https://homologacao.example.invalid}/configuracoes/assinatura
  frontend:
    restart: unless-stopped
    build:
      context: ../frontend
    image: wcfit-homologacao-frontend:local
    depends_on:
      - backend
    environment:
      HOMOLOG_SUPER_ADMIN_PROXY_LOCAL_TOKEN: ${HOMOLOG_SUPER_ADMIN_PROXY_LOCAL_TOKEN:-}
      HOMOLOG_ADMIN_GATEWAY: ${HOMOLOG_ADMIN_GATEWAY:-127.0.0.1}
    volumes:
      - ./wcfit-homologacao-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./wcfit-admin-local.conf:/etc/nginx/templates/admin-local.conf.template:ro
      - ./certs-local:/etc/nginx/certs-local:ro
    networks:
      - default
      - ingress
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8081:443"
networks:
  ingress: {}

volumes:
  pgdata_homologacao:
