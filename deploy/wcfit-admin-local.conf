server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs-local/admin.crt;
    ssl_certificate_key /etc/nginx/certs-local/admin.key;
    server_name localhost;
    allow 127.0.0.1;
    allow ${HOMOLOG_ADMIN_GATEWAY};
    deny all;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    location = /confirmar-conta { try_files $uri /index.html =404; }
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header X-Wcfit-Admin-Local "${HOMOLOG_SUPER_ADMIN_PROXY_LOCAL_TOKEN}";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
    }
    location = /aluno { return 308 /aluno/$is_args$args; }
    location = /aluno/ { try_files /portal.html =404; }
    location = /aluno/pwa-worker.js { try_files $uri =404; }
    location = /aluno/pwa/manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }
    location ^~ /aluno/pwa/ { try_files $uri =404; }
    location ^~ /aluno/ { try_files $uri /portal.html =404; }
    location / { try_files $uri $uri/ /index.html; }
}
