log_format wcfit_homolog '$request_method $status $request_time';
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log wcfit_homolog;
    error_log /var/log/nginx/error.log crit;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    location ~* ^/(api/)?super-admin(?:/|$) { return 404; }
    location ~* ^/(aceitar-convite|api/convites)(?:/|$) { return 404; }
    location = /confirmar-conta { try_files $uri /index.html =404; }
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
    }
    location / { try_files $uri $uri/ /index.html; }
}
