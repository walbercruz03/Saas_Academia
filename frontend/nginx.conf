log_format wcfit_minimo '$request_method $status $request_time $request_id';

server {
    listen 80;
    server_name localhost;
    access_log /var/log/nginx/access.log wcfit_minimo;
    error_log /var/log/nginx/error.log crit;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /aceitar-convite {
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        try_files $uri /index.html =404;
    }

    location = /confirmar-conta {
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        try_files $uri /index.html =404;
    }

    location = /aluno { return 308 /aluno/$is_args$args; }

    location = /aluno/ {
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        try_files /portal.html =404;
    }

    location = /aluno/pwa-worker.js {
        add_header Cache-Control no-cache always;
        try_files $uri =404;
    }

    location = /aluno/pwa/manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control no-cache always;
        try_files $uri =404;
    }

    location ^~ /aluno/pwa/ { try_files $uri =404; }

    location ^~ /aluno/ {
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        try_files $uri /portal.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
